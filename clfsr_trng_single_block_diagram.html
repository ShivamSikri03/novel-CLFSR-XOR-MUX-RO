<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Diagram: clfsr_trng_single.v</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background: #0b1329; color: #e2e8f0; padding: 24px; display: flex; flex-direction: column; align-items: center; }
  .header { text-align: center; margin-bottom: 20px; max-width: 1000px; }
  .header h1 { font-size: 24px; color: #38bdf8; margin-bottom: 6px; }
  .header p { font-size: 13px; color: #94a3b8; }
  .diagram-container { background: #131d3b; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 1200px; overflow-x: auto; }
  svg { width: 100%; height: auto; min-width: 960px; }
  .legend { margin-top: 20px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; font-size: 12px; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-color { width: 14px; height: 14px; border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <h1>Hardware Architecture Block Diagram: <code>clfsr_trng_single.v</code></h1>
  <p>1-Bit Chaotic-LFSR (CLFSR) Engine with 5-Stage Chebyshev Map, Physical TRNG XOR Fusion, and 8-Bit Byte Deserializer</p>
</div>

<div class="diagram-container">
<svg viewBox="0 0 1150 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gradLFSR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gradChaos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gradXOR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="gradS2P" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="gradIO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Marker Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- Module Boundary Outer Box -->
  <rect x="20" y="20" width="1110" height="680" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="40" y="52" fill="#94a3b8" font-size="14" font-weight="bold" letter-spacing="1">MODULE: clfsr_trng_single (Verilog RTL)</text>
  <text x="40" y="70" fill="#64748b" font-size="11">Inputs: clk, rst, enable, trng_in | Outputs: clfsr_bit, random_bit, R_Out[7:0], key_ready</text>

  <!-- Control Inputs on Left -->
  <g transform="translate(35, 120)">
    <rect x="0" y="0" width="90" height="32" rx="6" fill="url(#gradIO)" stroke="#64748b"/>
    <text x="45" y="20" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">clk</text>

    <rect x="0" y="45" width="90" height="32" rx="6" fill="url(#gradIO)" stroke="#64748b"/>
    <text x="45" y="65" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">rst</text>

    <rect x="0" y="90" width="90" height="32" rx="6" fill="url(#gradIO)" stroke="#64748b"/>
    <text x="45" y="110" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">enable</text>

    <rect x="0" y="400" width="90" height="34" rx="6" fill="#047857" stroke="#10b981" stroke-width="1.5"/>
    <text x="45" y="422" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">trng_in</text>
    <text x="45" y="445" fill="#a7f3d0" font-size="9" text-anchor="middle">(Physical MUX Jitter)</text>
  </g>

  <!-- ==================== SECTION 1: 16-BIT GALOIS LFSR ==================== -->
  <g transform="translate(180, 100)">
    <rect x="0" y="0" width="370" height="175" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="15" y="25" fill="#60a5fa" font-size="13" font-weight="bold">1. 16-bit Linear Feedback Shift Register (LFSR)</text>
    <text x="15" y="42" fill="#94a3b8" font-size="10">Maximal Poly: P(x) = x¹⁶ + x¹⁴ + x¹³ + x¹¹ + 1 | Seed: 0xA3C5</text>

    <!-- LFSR Shift Register Box -->
    <rect x="30" y="55" width="310" height="42" rx="6" fill="url(#gradLFSR)" stroke="#93c5fd" stroke-width="1"/>
    <text x="185" y="81" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">16-Bit Shift Register: lfsr[15:0]</text>

    <!-- Feedback XOR Gate -->
    <rect x="70" y="120" width="150" height="32" rx="6" fill="#1d4ed8" stroke="#60a5fa"/>
    <text x="145" y="140" fill="#e0f2fe" font-size="11" font-weight="bold" text-anchor="middle">XOR: taps [15^13^12^10]</text>

    <!-- Feedback lines -->
    <path d="M 330 97 L 330 136 L 220 136" fill="none" stroke="#93c5fd" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 70 136 L 15 136 L 15 76 L 30 76" fill="none" stroke="#93c5fd" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="250" y="130" fill="#93c5fd" font-size="9">feedback</text>

    <!-- Output Tap: lfsr[0] -->
    <line x1="340" y1="76" x2="430" y2="76" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="380" y="68" fill="#38bdf8" font-size="11" font-weight="bold">lfsr[0]</text>
  </g>

  <!-- ==================== SECTION 2: 5-STAGE CHEBYSHEV CHAOTIC MAP ==================== -->
  <g transform="translate(180, 305)">
    <rect x="0" y="0" width="370" height="365" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="15" y="25" fill="#c084fc" font-size="13" font-weight="bold">2. 5-Stage Pipelined 2nd-Order Chebyshev Map</text>
    <text x="15" y="42" fill="#94a3b8" font-size="10">Xₙ₊₁ = 1 - 2·(Xₙ)² in Signed Q1.15 Fixed-Point | Seed: 16'sh7EF0</text>

    <!-- Stage 1 -->
    <rect x="30" y="55" width="310" height="42" rx="6" fill="url(#gradChaos)" stroke="#c084fc"/>
    <text x="185" y="74" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Stage 1: Multiplier (Square)</text>
    <text x="185" y="88" fill="#e9d5ff" font-size="10" text-anchor="middle">x_square &lt;= x * x  [Signed 32-bit Q2.30]</text>

    <!-- Arrow 1->2 -->
    <line x1="185" y1="97" x2="185" y2="115" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 2 -->
    <rect x="30" y="115" width="310" height="42" rx="6" fill="url(#gradChaos)" stroke="#c084fc"/>
    <text x="185" y="134" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Stage 2: Arithmetic Left Shift (&times;2)</text>
    <text x="185" y="148" fill="#e9d5ff" font-size="10" text-anchor="middle">x_mult &lt;= x_square &lt;&lt;&lt; 1  [Signed 32-bit Q1.31]</text>

    <!-- Arrow 2->3 -->
    <line x1="185" y1="157" x2="185" y2="175" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 3 -->
    <rect x="30" y="175" width="310" height="42" rx="6" fill="url(#gradChaos)" stroke="#c084fc"/>
    <text x="185" y="194" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Stage 3: Bit-Slicing &amp; Truncation</text>
    <text x="185" y="208" fill="#e9d5ff" font-size="10" text-anchor="middle">x_section &lt;= x_mult[30:15]  [Signed 16-bit Q1.15]</text>

    <!-- Arrow 3->4 -->
    <line x1="185" y1="217" x2="185" y2="235" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 4 -->
    <rect x="30" y="235" width="310" height="42" rx="6" fill="url(#gradChaos)" stroke="#c084fc"/>
    <text x="185" y="254" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Stage 4: Constant Subtraction (1.0 - 2x²)</text>
    <text x="185" y="268" fill="#e9d5ff" font-size="10" text-anchor="middle">x_sub &lt;= 16'sh7FFF - x_section  [Signed 16-bit Q1.15]</text>

    <!-- Arrow 4->5 -->
    <line x1="185" y1="277" x2="185" y2="295" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 5 -->
    <rect x="30" y="295" width="310" height="42" rx="6" fill="url(#gradChaos)" stroke="#c084fc"/>
    <text x="185" y="314" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Stage 5: State Feedback Register</text>
    <text x="185" y="328" fill="#e9d5ff" font-size="10" text-anchor="middle">x &lt;= x_sub  [State Variable Xₙ₊₁]</text>

    <!-- Feedback Path to Stage 1 -->
    <path d="M 30 316 L 12 316 L 12 76 L 30 76" fill="none" stroke="#d8b4fe" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="16" y="200" fill="#d8b4fe" font-size="9" transform="rotate(-90 16 200)">Feedback x</text>

    <!-- Tap to output: x[10] -->
    <line x1="340" y1="316" x2="430" y2="316" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="365" y="308" fill="#c084fc" font-size="11" font-weight="bold">x[10]</text>
  </g>

  <!-- ==================== SECTION 3: XOR FUSION & 1-BIT OUTPUT ==================== -->
  <g transform="translate(610, 150)">
    <rect x="0" y="0" width="180" height="290" rx="10" fill="#132a36" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="12" y="24" fill="#2dd4bf" font-size="12" font-weight="bold">3. 1-Bit XOR Fusion</text>

    <!-- Connection from LFSR (lfsr[0]) -->
    <path d="M 0 26 L 45 26 L 45 75 L 75 75" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Connection from Chaos (x[10]) -->
    <path d="M 0 236 L 45 236 L 45 95 L 75 95" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- XOR Gate 1: CLFSR Generation -->
    <rect x="75" y="65" width="80" height="40" rx="8" fill="url(#gradXOR)" stroke="#5eead4" stroke-width="1.5"/>
    <text x="115" y="90" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">XOR 1</text>
    <text x="115" y="122" fill="#5eead4" font-size="10" text-anchor="middle">clfsr_bit</text>

    <!-- Output 1: clfsr_bit Pin -->
    <line x1="155" y1="85" x2="220" y2="85" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="185" cy="85" r="3" fill="#2dd4bf"/>
    <!-- Wire to outside output port -->
    <path d="M 185 85 L 185 45 L 340 45" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="345" y="49" fill="#2dd4bf" font-size="11" font-weight="bold">clfsr_bit (Port)</text>

    <!-- Path down to XOR 2 -->
    <path d="M 185 85 L 185 190 L 75 190" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Connection from trng_in -->
    <path d="M -485 270 L -45 270 L -45 210 L 75 210" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="-40" y="260" fill="#34d399" font-size="10">trng_in</text>

    <!-- XOR Gate 2: Real-time TRNG Whitening -->
    <rect x="75" y="180" width="80" height="40" rx="8" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
    <text x="115" y="205" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">XOR 2</text>
    <text x="115" y="238" fill="#6ee7b7" font-size="10" text-anchor="middle">random_bit</text>

    <!-- Output 2: random_bit Wire to Deserializer and Port -->
    <line x1="155" y1="200" x2="220" y2="200" stroke="#34d399" stroke-width="2"/>
    <circle cx="195" cy="200" r="3" fill="#34d399"/>
    <!-- Wire to outside output port -->
    <path d="M 195 200 L 195 160 L 340 160" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="345" y="164" fill="#34d399" font-size="11" font-weight="bold">random_bit (Port)</text>

    <!-- Forward to Serial-to-Parallel -->
    <line x1="195" y1="200" x2="245" y2="200" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  </g>

  <!-- ==================== SECTION 4: 8-BIT SERIAL-TO-PARALLEL DESERIALIZER ==================== -->
  <g transform="translate(860, 240)">
    <rect x="0" y="0" width="240" height="350" rx="10" fill="#2d1b11" stroke="#f97316" stroke-width="1.5"/>
    <text x="15" y="25" fill="#fb923c" font-size="12" font-weight="bold">4. 8-Bit Byte Deserializer</text>
    <text x="15" y="42" fill="#fdba74" font-size="9.5">Serial-to-Parallel Latch &amp; Strobe</text>

    <!-- 8-Bit Shift Register -->
    <rect x="25" y="60" width="190" height="48" rx="6" fill="url(#gradS2P)" stroke="#fdba74"/>
    <text x="120" y="82" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">8-Bit Shift Register</text>
    <text x="120" y="97" fill="#fed7aa" font-size="9" text-anchor="middle">{shift_reg[6:0], random_bit}</text>

    <!-- 3-bit Bit Counter -->
    <rect x="25" y="125" width="190" height="42" rx="6" fill="#7c2d12" stroke="#ea580c"/>
    <text x="120" y="144" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">3-Bit Counter [2:0]</text>
    <text x="120" y="158" fill="#fed7aa" font-size="9" text-anchor="middle">Counts 0..7 (Cycles on enable)</text>

    <!-- Comparator == 3'b111 -->
    <rect x="55" y="185" width="130" height="30" rx="6" fill="#9a3412" stroke="#fb923c"/>
    <text x="120" y="204" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">bit_counter == 7 ?</text>

    <!-- Output Latch Register: R_Out[7:0] -->
    <rect x="25" y="235" width="190" height="44" rx="6" fill="url(#gradS2P)" stroke="#fdba74"/>
    <text x="120" y="256" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">LATCH: R_Out[7:0]</text>
    <text x="120" y="270" fill="#ffedd5" font-size="9" text-anchor="middle">(Updated every 8 clocks)</text>

    <!-- Output Strobe: key_ready -->
    <rect x="25" y="295" width="190" height="36" rx="6" fill="#431407" stroke="#ea580c"/>
    <text x="120" y="318" fill="#fed7aa" font-size="11" font-weight="bold" text-anchor="middle">key_ready (1-Cycle Pulse)</text>

    <!-- Inter-box arrows -->
    <line x1="120" y1="167" x2="120" y2="185" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
    <line x1="120" y1="215" x2="120" y2="235" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
    <line x1="120" y1="279" x2="120" y2="295" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

    <!-- External Output Port Connectors -->
    <line x1="215" y1="257" x2="255" y2="257" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <line x1="215" y1="313" x2="255" y2="313" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  </g>

  <!-- Output Port Labels on Extreme Right -->
  <text x="1120" y="497" fill="#fb923c" font-size="12" font-weight="bold" text-anchor="end">R_Out[7:0] / random_byte</text>
  <text x="1120" y="553" fill="#fdba74" font-size="12" font-weight="bold" text-anchor="end">key_ready / byte_ready</text>

</svg>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-color" style="background:#2563eb;"></div><span>16-bit Galois LFSR</span></div>
  <div class="legend-item"><div class="legend-color" style="background:#7c3aed;"></div><span>5-Stage Chebyshev Map (Q1.15)</span></div>
  <div class="legend-item"><div class="legend-color" style="background:#0d9488;"></div><span>1-Bit XOR Fusion</span></div>
  <div class="legend-item"><div class="legend-color" style="background:#ea580c;"></div><span>8-Bit Deserializer & Strobe</span></div>
  <div class="legend-item"><div class="legend-color" style="background:#10b981;"></div><span>Physical TRNG Input (trng_in)</span></div>
</div>

</body>
</html>
